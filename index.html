<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Adivinhação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
    <h1>Jogo de Adivinhação</h1>

    <p class="descricao">
        Tente adivinhar o número secreto entre 1 e 100.
        Você terá 10 tentativas.
    </p>

    <div class="jogo">
        <label for="palpite">Digite seu palpite:</label>
        <input type="number" id="palpite" min="1" max="100" placeholder="Número de 1 a 100">

        <button id="botao-chutar">Chutar</button>
    </div>

    <p id="mensagem">Digite um número e clique em Chutar.</p>
    <p id="tentativas">Tentativas restantes: 10</p>
</main>

<script src="script.js"></script>
</body>
</html>
